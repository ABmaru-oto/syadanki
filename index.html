<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<title>踏切遮断桿シミュレーション（長さ8m・正しい非遮断角度）</title>
<style>
  body { font-family: sans-serif; }
  #info { margin-top: 10px; font-size: 16px; }
</style>
</head>
<body>

<h2>踏切遮断桿シミュレーション（長さ8m・非遮断時は4.5m）</h2>
<p>支点高さ80cm、非遮断時先端高さ4.5m、遮断桿長さ8m → 正しい角度は約27.5°。</p>

<!-- 描画用SVG（縦方向 0〜500cm を想定） -->
<svg id="svg" width="1200" height="700" style="border:1px solid #ccc; background:#f9f9f9;">
  <!-- 地面（0cm） -->
  <line x1="0" y1="650" x2="1200" y2="650" stroke="black" stroke-width="3"/>

  <!-- 支点（左端）高さ80cm → y = 650 - 80 = 570 -->
  <circle id="pivot" cx="150" cy="570" r="8" fill="black"/>

  <!-- 遮断桿の初期角度を計算して配置 -->
  <!-- 長さ8m → 800px として描画 -->
  <!-- 角度27.5° → dx = 800*cosθ, dy = -800*sinθ -->
  <!-- sinθ = 0.4625, cosθ ≈ 0.8866 -->
  <!-- dx ≈ 709px, dy ≈ -370px -->
  <line id="bar" x1="150" y1="570" x2="859" y2="200"
        stroke="red" stroke-width="10" stroke-linecap="round"/>

  <!-- 先端マーカー -->
  <circle id="tip" cx="859" cy="200" r="8" fill="blue"/>
</svg>

<div id="info">
  支点高さ: 80cm / 先端高さ: 450cm / 桿の長さ: 800cm / 角度: 27.5°
</div>

<script>
const svg = document.getElementById("svg");
const bar = document.getElementById("bar");
const tip = document.getElementById("tip");
const info = document.getElementById("info");

let dragging = false;

// 支点の位置（固定）
const pxPivotX = 150;
const pxPivotY = 650 - 80; // 570

// 桿の長さ（px換算）
const barLen = 800; // 8m → 800px

svg.addEventListener("mousedown", () => dragging = true);
svg.addEventListener("mouseup", () => dragging = false);
svg.addEventListener("mouseleave", () => dragging = false);

svg.addEventListener("mousemove", e => {
  if (!dragging) return;

  const rect = svg.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  // 支点からのベクトル
  const dx = mouseX - pxPivotX;
  const dy = mouseY - pxPivotY;

  // マウス方向に長さ800pxの棒を伸ばす
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const scale = barLen / len;

  const tipX = pxPivotX + dx * scale;
  const tipY = pxPivotY + dy * scale;

  // 更新
  bar.setAttribute("x1", pxPivotX);
  bar.setAttribute("y1", pxPivotY);
  bar.setAttribute("x2", tipX);
  bar.setAttribute("y2", tipY);

  tip.setAttribute("cx", tipX);
  tip.setAttribute("cy", tipY);

  // 高さ(cm)
  const hTip = 650 - tipY;

  // 角度計算
  const angleRad = Math.atan2(tipX - pxPivotX, pxPivotY - tipY);
  const angleDeg = angleRad * 180 / Math.PI;

  info.textContent =
    `支点高さ: 80cm / 先端高さ: ${hTip.toFixed(1)}cm / 桿の長さ: 800cm / 角度: ${angleDeg.toFixed(1)}°`;
});
</script>

</body>
</html>
